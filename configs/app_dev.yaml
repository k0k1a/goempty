async:
  concurrency: 4
  max_blocking_tasks: 1000
  timeout: 30s

mysql:
  dsn: "goempty:CHANGE_ME@tcp(127.0.0.1:3306)/goempty?charset=utf8mb4&parseTime=true&loc=Local&timeout=5s&readTimeout=5s&writeTimeout=5s"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

redis:
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

mongodb:
  uri: "mongodb://127.0.0.1:27017"
  max_pool_size: 10
  min_pool_size: 1
  max_conn_idle_time: 5m
  connect_timeout: 5s
  server_selection_timeout: 5s
  timeout: 5s

kafka:
  brokers:
    - "127.0.0.1:9092"
  topic_mapping:
    social-forum: social-forum-dev
    hello: hello-dev

kafka_consumer:
  brokers:
    - "127.0.0.1:9092"
  group_name: goempty-hello
  topics:
    - hello
  topic_mapping:
    hello: hello-dev
