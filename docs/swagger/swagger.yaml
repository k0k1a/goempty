basePath: /
definitions:
  entity.HelloResponse:
    properties:
      message:
        example: hello
        type: string
    type: object
  response.Response-any:
    properties:
      code:
        description: 业务状态码，0 表示成功，非 0 表示失败；未知内部错误为 -1
        type: integer
      data:
        description: 接口业务数据；失败时为 null
      message:
        description: 响应消息，成功时为 success，失败时为可公开的错误说明
        type: string
      request_id:
        description: 预留的可选请求 ID，当前不输出此字段；实际请求 ID 通过 X-Request-ID 响应头返回
        type: string
    type: object
  response.Response-entity_HelloResponse:
    properties:
      code:
        description: 业务状态码，0 表示成功，非 0 表示失败；未知内部错误为 -1
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/entity.HelloResponse'
        description: 接口业务数据；失败时为 null
      message:
        description: 响应消息，成功时为 success，失败时为可公开的错误说明
        type: string
      request_id:
        description: 预留的可选请求 ID，当前不输出此字段；实际请求 ID 通过 X-Request-ID 响应头返回
        type: string
    type: object
info:
  contact: {}
  description: goempty HTTP API. Ordinary JSON responses use code/message/data; code
    0 means success. Request IDs are returned in the X-Request-ID header. Health endpoints
    return an empty body.
  title: goempty API
  version: "1.0"
paths:
  /healthz:
    get:
      responses:
        "200":
          description: OK; empty response body
          headers:
            X-Request-ID:
              description: Request ID
              type: string
      summary: Check liveness
      tags:
      - health
  /hello:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Greeting returned successfully; code is 0
          headers:
            X-Request-ID:
              description: Request ID
              type: string
          schema:
            $ref: '#/definitions/response.Response-entity_HelloResponse'
        "400":
          description: Internal error; code is -1, data is null
          headers:
            X-Request-ID:
              description: Request ID
              type: string
          schema:
            $ref: '#/definitions/response.Response-any'
      summary: Get a greeting
      tags:
      - hello
  /readyz:
    get:
      description: Returns 200 with an empty body; does not check MySQL or Redis connectivity.
      responses:
        "200":
          description: OK; empty response body
          headers:
            X-Request-ID:
              description: Request ID
              type: string
      summary: Check readiness
      tags:
      - health
swagger: "2.0"
